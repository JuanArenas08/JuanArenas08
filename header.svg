<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 340" width="1000" height="340" role="img" aria-label="Hola, soy Juan Pablo. Estudiante de la ESPOL">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0f14"/>
      <stop offset="1" stop-color="#0d1117"/>
    </linearGradient>
    <radialGradient id="glow" cx="85%" cy="95%" r="55%">
      <stop offset="0" stop-color="#3fb950" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#3fb950" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#ffffff" stroke-opacity="0.035"/>
    </pattern>
    <style>
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      .sans { font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif; }
      .blink { animation: blink 1s steps(1) infinite; }
      @keyframes blink { 50% { opacity: 0; } }
      .type { clip-path: inset(0 100% 0 0); animation: type 3.2s steps(44) 0.6s forwards; }
      @keyframes type { to { clip-path: inset(0 0 0 0); } }
    </style>
  </defs>

  <rect width="1000" height="340" rx="22" fill="url(#bg)"/>
  <rect width="1000" height="340" rx="22" fill="url(#grid)"/>
  <rect width="1000" height="340" rx="22" fill="url(#glow)"/>
  <rect x="0.5" y="0.5" width="999" height="339" rx="22" fill="none" stroke="#30363d"/>

  <!-- pill -->
  <rect x="60" y="48" width="330" height="34" rx="17" fill="#161b22" stroke="#30363d"/>
  <circle cx="82" cy="65" r="5" fill="#3fb950"/>
  <text x="98" y="70" class="mono" font-size="14" fill="#8b949e">abierto a proyectos · Guayaquil, EC</text>

  <!-- título -->
  <text x="60" y="170" class="sans" font-size="76" font-weight="800" fill="#ffffff">Hola, soy Juan Pablo<tspan fill="#8b949e">.</tspan></text>

  <!-- prompt con efecto de escritura -->
  <text x="60" y="232" class="mono" font-size="22" fill="#3fb950">~ ❯</text>
  <g class="type">
    <text x="130" y="232" class="mono" font-size="22" fill="#e6edf3">estudiante de la ESPOL · Hazlo incluso cansado</text>
  </g>

  <text x="60" y="305" class="mono" font-size="14" fill="#8b949e">github.com/JuanArenas08</text>

  <!-- ventana de terminal -->
  <g transform="translate(640 40)">
    <rect width="300" height="170" rx="12" fill="#0d1117" stroke="#30363d"/>
    <path d="M0 12a12 12 0 0 1 12-12h276a12 12 0 0 1 12 12v28H0z" fill="#161b22"/>
    <line x1="0" y1="40" x2="300" y2="40" stroke="#30363d"/>
    <circle cx="22" cy="20" r="6" fill="#ff5f56"/>
    <circle cx="42" cy="20" r="6" fill="#ffbd2e"/>
    <circle cx="62" cy="20" r="6" fill="#27c93f"/>
    <text x="278" y="25" text-anchor="end" class="mono" font-size="12" fill="#8b949e">~/proyectos</text>
    <circle cx="26" cy="68" r="5" fill="#3fb950"/>
    <text x="42" y="73" class="mono" font-size="15" fill="#e6edf3">conversor-de-bases</text>
    <circle cx="26" cy="100" r="5" fill="#3fb950"/>
    <text x="42" y="105" class="mono" font-size="15" fill="#e6edf3">NidU</text>
    <circle cx="26" cy="132" r="5" fill="#3fb950"/>
    <text x="42" y="137" class="mono" font-size="15" fill="#e6edf3">SRVP-SBD</text>
  </g>
  <text x="940" y="305" text-anchor="end" class="mono" font-size="14" fill="#8b949e">ESPOL · PAO II 2026</text>
</svg>
